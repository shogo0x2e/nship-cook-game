</style><script type="module" src="./survey-review.js"></script></head><body><main><p class="eyebrow">PoC / アンケート原案</p><h1>アンケート一覧</h1><p class="survey-review-intro">質問内容を確認するための一覧です。回答は<a href="./index.html#child-survey">プロトタイプのアンケート画面</a>で行えます。最初に年齢だけを入力します。8歳以下と9歳以上で08の言葉と回答の前提を切り替えます。</p><ol id="review-scale" class="review-scale"></ol><div id="survey-review"></div><footer>体験への評価は7段階の同意尺度。子ども・保護者の評価は1〜7だけで回答します。子どもと保護者のアンケートに任意の自由記述「そう答えた理由・気になった点」を設けます。<br>8歳以下は今の感想、それより上は幼稚園頃を想定します。現在の体験への評価を終えてから、今後の構想5点を紹介し、月額上限を尋ねます。特定の金額は提示しません。</footer></main></body></html>
