name: Production release

on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: cookgame-production
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/production' &&
      github.repository == 'shogo0x2e/nship-cook-game' &&
      github.actor_id == '100509624'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
      - name: Verify application
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run setup:pose
          npm run build
          npm run test:e2e
      - name: Build immutable amd64 image
        run: |
          docker build --platform linux/amd64 \
            --build-arg APP_REVISION="$GITHUB_SHA" \
            --tag "nship-cook-game:production-$GITHUB_SHA" \
            --file deploy/Dockerfile .
      - name: Verify container and prepare release
        run: python3 deploy/prepare-release.py
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="production-$GITHUB_SHA"
          gh release create "$tag" release/image.tar.gz release/release.json \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "Production $GITHUB_SHA" \
            --notes "Validated production image for commit $GITHUB_SHA."
          gh release edit "$tag" --draft=false
